name: Get Citation Data

on: 
 workflow_dispatch:
 schedule:
  - cron:  '0 8 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Reqs
      run: |
        cd ./google_scholar_crawler
        pip install -r requirements.txt
    - name: Run
      run: |
        cd ./google_scholar_crawler
        # Google Scholar sometimes blocks CI runners. Try twice with a time cap;
        # if both attempts fail, keep the previous citation data and end quietly
        # (the next daily run will try again).
        ok=0
        for i in 1 2; do
          if timeout 300 python main.py; then ok=1; break; fi
          echo "Attempt $i failed"
          if [ "$i" = 1 ]; then sleep 60; fi
        done
        if [ "$ok" = 0 ]; then
          echo "::warning::Google Scholar blocked the request; keeping previous citation data."
          exit 0
        fi
        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env: 
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
